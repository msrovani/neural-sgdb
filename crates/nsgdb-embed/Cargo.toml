[package]
name = "nsgdb-embed"
version = "0.1.0"
edition = "2021"
description = "Local embedder for neural-sgdb — deterministic stub (384-dim) proving the Embedder seam; candle/ONNX feature will replace the hash without touching the core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/msrovani/neural-sgdb"

[dependencies]
neural-sgdb = { path = "../.." }

[dependencies.candle-core]
version = "0.6"
optional = true

[dependencies.candle-nn]
version = "0.6"
optional = true

[dependencies.tokenizers]
version = "0.20"
optional = true

[features]
default = []
candle = ["candle-core", "candle-nn", "tokenizers"]
