name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2

      - name: cargo test (default)
        run: cargo test

      - name: cargo test (p2p)
        run: cargo test --features p2p

      - name: cargo test (no-default-features)
        run: cargo test --no-default-features

      - name: clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: doc (deny warnings)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: no_std gate (x86_64-unknown-none)
        run: cargo check --no-default-features --target x86_64-unknown-none

      - name: build examples
        run: cargo build --release --examples

      - name: MCP smoke (4 tools + structured health)
        run: bash scripts/mcp-smoke.sh

      - name: stress (reduced N for CI)
        run: |
          STRESS_N=20000 STRESS_REOPEN=5000 STRESS_DEL=10000 STRESS_SIMD=2000 \
            cargo run --release --example stress

      - name: bench (smoke, reduced)
        run: cargo run --release --example bench

  mcp-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: MCP smoke (PowerShell)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/mcp-smoke.ps1
