name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2

      - name: cargo test (default)
        run: cargo test

      - name: cargo test (p2p)
        run: cargo test --features p2p

      - name: cargo test (no-default-features)
        run: cargo test --no-default-features

      - name: clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: doc (deny warnings)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: docs version gate (P1.1)
        # Fails if the previous version lingers in LIVE docs (v1.1.23 lesson).
        run: bash scripts/docs-version-gate.sh

      - name: no_std gate (x86_64-unknown-none)
        # `cargo check` não emite nativo e mascara crash de codegen SIMD
        # (`STATUS_ILLEGAL_INSTRUCTION` em `#[target_feature]` + target none).
        run: cargo build --release --no-default-features --target x86_64-unknown-none

      - name: build examples
        run: cargo build --release --examples

      - name: MCP smoke (4 tools + structured health)
        run: bash scripts/mcp-smoke.sh

      - name: stress (reduced N for CI)
        run: |
          STRESS_N=20000 STRESS_REOPEN=5000 STRESS_DEL=10000 STRESS_SIMD=2000 \
            cargo run --release --example stress

      - name: bench (smoke, reduced)
        run: cargo run --release --example bench

      # v1.4.4 (ISSUE 18 da triagem s413): o `wire_fuzz` existia no src mas o
      # CI nunca o rodava — a garantia de "decode bounds-checked" era por
      # inspeção. Aqui ela vira CONTÍNUA: qualquer decode que panicar derruba o
      # build em vez de esperar alguém rodar na mão.
      - name: wire_fuzz (property test dos 9 tipos wire)
        run: cargo test --release --lib wire_fuzz -- --nocapture

      # NOTA (achado rodando o gate, v1.4.5): a primeira versao deste step era
      # `cargo test --lib -- --shuffle`, e NUNCA rodou — `--shuffle` e instavel
      # no libtest e exige `-Z unstable-options`; o libtest pre-compilado do
      # toolchain nao aceita nem em nightly, entao o job quebrava em TODA run.
      # `--test-threads=1` cobre a mesma classe (estado global vazado entre
      # testes — que era o risco que o seam `set_audit_hasher`, um `AtomicU8`,
      # introduziu) e roda no stable. Para ordem embaralhada de verdade o gate
      # precisa de um toolchain nightly com libtest unstable de fato.
      - name: lib tests (em serie — expoe estado global compartilhado)
        run: cargo test --lib -- --test-threads=1

      # v1.4.4: goldens de formato no proprio repo (a paridade byte-exata com o
      # OS e provada do lado do kernel; aqui ficam os vetores de NMD1/MDM1/AUD1).
      - name: golden vectors (NMD1/MDM1 v8/AUD1/TKLV)
        run: cargo test --lib golden

  mcp-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: MCP smoke (PowerShell)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/mcp-smoke.ps1
