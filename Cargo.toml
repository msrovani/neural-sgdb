[package]
name = "neural-sgdb"
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Persistent, transferable memory substrate for AI agents (no_std + std)"
repository = "https://github.com/msrovani/neural-sgdb"

[features]
default = ["std", "file-storage", "simd-runtime"]
std = []
file-storage = ["std"]
simd-runtime = ["std"]
p2p = ["std"]

[dev-dependencies]
serde_json = "1"

[[example]]
name = "p2p_telepathy"
required-features = ["p2p"]

[[example]]
name = "mesh_simulation"
required-features = ["p2p"]

[[example]]
name = "signed_peer"
required-features = ["p2p"]

# Exemplos que dependem de backend de arquivo (FileStorage/TickvFile):
# sem `file-storage` o crate roda no_std/no-file — estes exemplos não são
# compilados (nem em `cargo test --no-default-features`).
[[example]]
name = "bench"
required-features = ["file-storage"]

[[example]]
name = "stress"
required-features = ["file-storage"]

# Hot SGDB Test (Via 3) — client cru que dirige o mcp_server como um IDE faria.
# `file-storage` garante o teste de PERSISTÊNCIA real (cross-process).
[[example]]
name = "mcp_client"
required-features = ["file-storage"]

# Cognitive QA audit — "retorna memórias, não dados" (attack/corruption/fidelity)
[[example]]
name = "audit"
required-features = ["file-storage"]

# HTTP embedder (v1.1.3 S2) — liga o trait Embedder num endpoint HTTP real
# (raw HTTP/1.1 via std::net + serde_json; zero deps novas no crate)
[[example]]
name = "embedder_http"

# Protocolo do agente (v1.1.4, itens 2–6) — disciplina de uso para DECISÃO:
# ontologia de entidades, fato estruturado, evidência por provenance, ciclo
# de vida (supersede/feedback/expire_old) e protocolo de duas passadas.
[[example]]
name = "agent_protocol"
